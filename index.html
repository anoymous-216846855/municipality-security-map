<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇪🇺</text></svg>" />
  <title>Municipal Website Security</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont,
      "Segoe UI", "Liberation Sans", Arial, sans-serif; background: #f0f4f8; }

    #map { position: fixed; inset: 0; z-index: 0; }

    /* ── Top bar ── */
    #topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      height: 54px; display: flex; align-items: center; gap: 16px;
      padding: 0 20px; background: #154194; zoom: 1.2;
    }
    .eu-stars { font-size: 22px; line-height: 1; flex-shrink: 0; }
    .brand { font-size: 15px; font-weight: 600; color: #fff; letter-spacing: 0.1px; white-space: nowrap; }
    .brand span { color: #FFCC00; }

    /* ── Left-side controls (back + level toggle) ── */
    #left-controls {
      position: fixed; top: 74px; left: 56px; z-index: 999;
      display: flex; flex-direction: column; gap: 6px; zoom: 1.2;
      transition: transform 0.18s ease, opacity 0.18s ease;
    }
    body.controls-collapsed #left-controls { transform: translateX(-18px); opacity: 0; pointer-events: none; }
    #subnav-toggle {
      position: fixed; top: 74px; left: 16px; z-index: 1001;
      width: 32px; height: 32px; border: 1px solid #dde3ec;
      border-radius: 4px; background: #fff; color: #154194;
      font-size: 13px; font-weight: 800; cursor: pointer;
      box-shadow: 0 1px 6px rgba(0,0,0,0.10); zoom: 1.2;
    }
    #subnav-toggle:hover { background: #f0f4fb; }
    #nav-back { display: none; }
    .nav-back-btn {
      display: flex; align-items: center; gap: 6px;
      background: #fff; border: 1px solid #dde3ec; border-radius: 4px;
      padding: 6px 12px; font-size: 12.5px; font-weight: 500; color: #154194;
      cursor: pointer; box-shadow: 0 1px 6px rgba(0,0,0,0.1); transition: background 0.15s;
    }
    .nav-back-btn:hover { background: #f0f4fb; }
    .nav-back-arrow { font-size: 14px; line-height: 1; }

    #level-controls { display: none; }
    .level-btn-group {
      display: flex;
      background: #fff; border: 1px solid #dde3ec; border-radius: 4px;
      overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,0.1);
    }
    .level-btn {
      padding: 5px 11px; font-size: 11.5px; font-weight: 600;
      border: none; background: transparent; color: #64748b;
      cursor: pointer; transition: all 0.15s; border-right: 1px solid #dde3ec;
      line-height: 1.4;
    }
    .level-btn:last-child { border-right: none; }
    .level-btn:hover { background: #f0f4fb; color: #154194; }
    .level-btn.active { background: #154194; color: #fff; }
    .level-btn-label { font-size: 9.5px; font-weight: 400; opacity: 0.8; display: block; }

    /* ── Right info panel ── */
    #info-panel {
      position: fixed; top: 74px; right: 16px; z-index: 1000;
      width: 280px; background: #fff; border: 1px solid #dde3ec;
      border-radius: 6px; box-shadow: 0 2px 12px rgba(21,65,148,0.10);
      overflow: hidden; transform: translateX(300px);
      transition: transform 0.25s ease; zoom: 1.2;
    }
    #info-panel.visible { transform: translateX(0); }
    #info-panel.pinned { border-color: #154194; }
    #info-panel-header {
      background: #f0f4fb; border-bottom: 1px solid #dde3ec;
      padding: 10px 12px 8px;
      display: flex; justify-content: space-between; align-items: flex-start;
    }
    #info-panel.pinned #info-panel-header { background: #e8eef8; }
    .info-level-badge {
      display: inline-block; font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.5px; color: #154194; background: #e0e9f8;
      padding: 2px 6px; border-radius: 2px; margin-bottom: 4px;
    }
    .info-title { font-size: 14px; font-weight: 600; color: #1a202c; }
    .info-sub   { font-size: 11.5px; color: #718096; margin-top: 2px; }
    .info-header-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .info-pin-indicator { font-size: 12px; color: #154194; opacity: 0; transition: opacity 0.15s; }
    #info-panel.pinned .info-pin-indicator { opacity: 1; }
    #info-close {
      background: none; border: none; color: #a0aec0; font-size: 18px;
      line-height: 1; cursor: pointer; padding: 0;
    }
    #info-close:hover { color: #4a5568; }
    #info-body { padding: 10px 12px 12px; user-select: text; }

    .info-row {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 4px 0; border-bottom: 1px solid #f0f4f8; font-size: 12.5px;
    }
    .info-row:last-child { border-bottom: none; }
    .info-row .lbl { color: #718096; }
    .info-row .val { color: #2d3748; font-weight: 500; text-align: right; }
    .info-row a {
      color: #154194; text-decoration: none; font-size: 11.5px;
      max-width: 170px; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; display: block;
    }
    .info-row a:hover { text-decoration: underline; }
    .stat-block { margin-top: 6px; }
    .stat-header {
      display: flex; justify-content: space-between; align-items: baseline;
      font-size: 11.5px; color: #4a5568; margin-bottom: 5px;
    }
    .stat-header .pct { font-size: 20px; font-weight: 700; color: #154194; }
    .stat-bar-track { height: 6px; background: #e2e8f0; border-radius: 3px; overflow: hidden; }
    .stat-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
    .stat-counts { font-size: 11px; color: #a0aec0; margin-top: 4px; }

    /* ── Legend ── */
    #legend {
      position: fixed; bottom: 28px; left: 16px; z-index: 1000;
      background: #fff; border: 1px solid #dde3ec;
      border-radius: 6px; padding: 10px 14px;
      box-shadow: 0 2px 12px rgba(21,65,148,0.10); min-width: 150px; zoom: 1.2;
    }
    #legend.closed { display: none; }
    .legend-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
    .legend-title {
      font-size: 10.5px; font-weight: 700; color: #154194;
      text-transform: uppercase; letter-spacing: 0.6px;
    }
    .legend-close {
      border: none; background: transparent; color: #94a3b8; cursor: pointer;
      font-size: 17px; line-height: 1; padding: 0 2px;
    }
    .legend-close:hover { color: #475569; }
    #legend-toggle {
      position: fixed; left: 16px; bottom: 28px; z-index: 1000; display: none;
      background: #fff; border: 1px solid #dde3ec; border-radius: 6px;
      padding: 7px 10px; color: #154194; font-size: 12px; font-weight: 600;
      box-shadow: 0 2px 12px rgba(21,65,148,0.10); cursor: pointer; zoom: 1.2;
    }
    #legend-toggle.visible { display: block; }
    .legend-item {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: #4a5568; margin-bottom: 5px;
    }
    .legend-dot { width: 11px; height: 11px; border-radius: 2px; flex-shrink: 0; }
    .legend-gradient { height: 8px; border-radius: 3px; margin-top: 10px; margin-bottom: 4px; }
    .legend-range { display: flex; justify-content: space-between; font-size: 10.5px; color: #718096; }
    .legend-nodata {
      display: flex; align-items: center; gap: 8px;
      font-size: 11px; color: #718096;
      margin-top: 7px; padding-top: 7px; border-top: 1px solid #f0f4f8;
    }

    /* ── Loading ── */
    #loading {
      position: fixed; bottom: 28px; right: 16px; z-index: 2000;
      background: #fff; border: 1px solid #dde3ec; border-radius: 6px; padding: 8px 14px;
      box-shadow: 0 2px 12px rgba(21,65,148,0.10);
      display: none; align-items: center; gap: 8px; font-size: 12.5px; color: #4a5568; zoom: 1.2;
    }
    #loading.show { display: flex; }
    .spinner {
      width: 16px; height: 16px; flex-shrink: 0;
      border: 2px solid #e2e8f0; border-top-color: #154194;
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .leaflet-tooltip {
      background: #fff; border: 1px solid #dde3ec; border-radius: 4px; padding: 5px 9px;
      font-size: 12.5px; color: #2d3748; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .leaflet-tooltip::before { display: none; }
    .leaflet-control-zoom { zoom: 1.2; }
    .tip-name { font-weight: 600; }
    .tip-val  { color: #154194; }

    @media (max-width: 720px) {
      html, body { overflow: hidden; }
      #topbar {
        height: 48px; min-height: 48px; gap: 8px; padding: 0 10px; zoom: 1;
      }
      .eu-stars { font-size: 18px; }
      .brand { font-size: 14px; }
      #left-controls {
        top: 58px; left: 8px; right: 8px; zoom: 1;
        max-width: calc(100vw - 16px);
      }
      body.controls-collapsed #left-controls { transform: translateY(-8px); opacity: 0; pointer-events: none; }
      #subnav-toggle { top: 58px; width: 28px; height: 30px; zoom: 1; }
      .nav-back-btn { padding: 6px 9px; font-size: 11.5px; max-width: 100%; }
      #nav-back-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .level-btn-group { max-width: 100%; overflow-x: auto; }
      .level-btn { padding: 5px 9px; font-size: 11px; }

      #info-panel {
        top: auto; left: 0; right: 0; bottom: 0; width: 100%;
        max-height: 58vh; border-radius: 10px 10px 0 0;
        transform: translateY(110%); zoom: 1;
      }
      #info-panel.visible { transform: translateY(0); }
      #info-panel-header { padding: 9px 12px 7px; }
      #info-body { max-height: 20vh; overflow-y: auto; padding: 8px 12px; }
      .info-title { font-size: 13px; }
      .info-row { font-size: 11.5px; }
      .stat-header .pct { font-size: 15px !important; }

      #legend {
        left: 8px; bottom: 24px; max-width: min(210px, calc(100vw - 84px));
        padding: 8px 10px; zoom: 1;
      }
      .legend-head { margin-bottom: 6px; }
      .legend-title { font-size: 9.5px; }
      .legend-item { font-size: 11px; margin-bottom: 4px; }
      #legend-toggle { left: 8px; bottom: 24px; padding: 7px 9px; zoom: 1; }
      #loading { right: 8px; bottom: 72px; zoom: 1; }
      .leaflet-control-zoom { zoom: 1; }
      .leaflet-control-attribution {
        font-size: 9px; max-width: 72vw; white-space: nowrap; overflow: hidden;
        text-overflow: ellipsis;
      }
    }
  </style>
</head>
<body>

<div id="map"></div>

<nav id="topbar">
  <span class="eu-stars">🇪🇺</span>
  <div class="brand">Municipal Website <span>Security Scores</span></div>
</nav>

<!-- Left-side controls: back button + NUTS level toggle -->
<button id="subnav-toggle" onclick="toggleControls()" title="Show or hide subnavigation">‹</button>
<div id="left-controls">
  <div id="nav-back">
    <button class="nav-back-btn" onclick="navBack()">
      <span class="nav-back-arrow">←</span>
      <span id="nav-back-label">Back to Europe</span>
    </button>
  </div>
  <div id="level-controls">
    <div class="level-btn-group">
      <button class="level-btn" data-level="nuts2" onclick="setSubdivLevel('nuts2')">
        NUTS 2<span class="level-btn-label">Regions</span>
      </button>
      <button class="level-btn" data-level="nuts3" onclick="setSubdivLevel('nuts3')">
        NUTS 3<span class="level-btn-label">Districts</span>
      </button>
      <button class="level-btn" data-level="lau" onclick="setSubdivLevel('lau')">
        LAU<span class="level-btn-label">Municipalities</span>
      </button>
    </div>
  </div>
</div>

<!-- Info panel (right side) -->
<div id="info-panel">
  <div id="info-panel-header">
    <div>
      <div class="info-level-badge" id="info-badge">Country</div>
      <div class="info-title" id="info-title">—</div>
      <div class="info-sub"   id="info-sub"></div>
    </div>
    <div class="info-header-actions">
      <span class="info-pin-indicator" title="Pinned">📌</span>
      <button id="info-close" onclick="hideInfo()">×</button>
    </div>
  </div>
  <div id="info-body"></div>
</div>

<div id="legend"></div>
<button id="legend-toggle" onclick="showLegendPanel()">Legend</button>

<div id="loading"><div class="spinner"></div><span id="loading-msg">Loading…</span></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.3/leaflet-maplibre-gl.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════
const BASE    = 'data/';
const SCORING = BASE + 'scoring/';

// Map settings of the scoring layer (data/scoring/index.json): label, colour scale, colour bands.
let EVAL = null;

const COUNTRY_NAMES = {
  AT:'Austria',BE:'Belgium',BG:'Bulgaria',CY:'Cyprus',CZ:'Czechia',
  DE:'Germany',DK:'Denmark',EE:'Estonia',EL:'Greece',ES:'Spain',
  FI:'Finland',FR:'France',HR:'Croatia',HU:'Hungary',IE:'Ireland',
  IS:'Iceland',IT:'Italy',LI:'Liechtenstein',LT:'Lithuania',LU:'Luxembourg',
  LV:'Latvia',MK:'North Macedonia',MT:'Malta',NL:'Netherlands',NO:'Norway',
  PL:'Poland',PT:'Portugal',RO:'Romania',RS:'Serbia',SE:'Sweden',
  SI:'Slovenia',SK:'Slovakia',
};
const COUNTRY_FLAGS = {
  AT:'🇦🇹',BE:'🇧🇪',BG:'🇧🇬',CY:'🇨🇾',CZ:'🇨🇿',DE:'🇩🇪',DK:'🇩🇰',EE:'🇪🇪',
  EL:'🇬🇷',ES:'🇪🇸',FI:'🇫🇮',FR:'🇫🇷',HR:'🇭🇷',HU:'🇭🇺',IE:'🇮🇪',IS:'🇮🇸',
  IT:'🇮🇹',LI:'🇱🇮',LT:'🇱🇹',LU:'🇱🇺',LV:'🇱🇻',MK:'🇲🇰',MT:'🇲🇹',NL:'🇳🇱',
  NO:'🇳🇴',PL:'🇵🇱',PT:'🇵🇹',RO:'🇷🇴',RS:'🇷🇸',SE:'🇸🇪',SI:'🇸🇮',SK:'🇸🇰',
};
const CC_LABEL    = cc => cc === 'EL' ? 'GR' : cc;
const countryName = cc => COUNTRY_NAMES[cc] || cc;
const countryFlag = cc => COUNTRY_FLAGS[cc] || '';

// ═══════════════════════════════════════════════════════════════
// STATE
// 'world' → 'country' (subdiv outlines visible) → 'subdiv' (municipalities visible)
//                                               → 'lau' (all municipalities of the country)
// ═══════════════════════════════════════════════════════════════
const S = {
  level:       'world',   // 'world' | 'country' | 'subdiv' | 'lau'
  country:     null,
  subdivId:    null,      // NUTS2 or NUTS3 ID depending on subdivLevel
  subdivLevel: 'lau',     // 'lau' | 'nuts2' | 'nuts3' — default to municipality layer
  infoPinned:  false,
  dataCache:   {},
  geoCache:    {},
  pinnedMuniLayer: null,  // Leaflet layer of the currently pinned municipality
};

// ═══════════════════════════════════════════════════════════════
// MAP + PANES
// ═══════════════════════════════════════════════════════════════
const map = L.map('map', {
  center:[54,13], zoom:5,
  zoomControl:false, preferCanvas:true,
  minZoom:3, maxZoom:17,
});
L.control.zoom({ position:'bottomright' }).addTo(map);

L.maplibreGL({
  style: 'https://tiles.openfreemap.org/styles/positron',
}).addTo(map);
map.attributionControl.addAttribution('Based on the <a href="https://municipalytics.internetwarte.eu/" target="_blank" rel="noopener">Municipalytics map</a> (internetwarte.eu) | © EuroGeographics for the administrative boundaries | municipal websites: <a href="https://www.wikidata.org/" target="_blank" rel="noopener">Wikidata</a>');

// Custom pane for subdiv borders — sits above the municipality canvas (overlayPane=400)
map.createPane('subdivPane');
map.getPane('subdivPane').style.zIndex = 450;

// At subdiv level, subdivPane has pointer-events:none so muni canvas hover works.
// Region switching is handled here: clicks that miss municipalities reach the map.
map.on('click', function(e) {
  if (S.level !== 'subdiv' || !subdivLayer) return;
  // Find the subdiv region whose bounding box contains the click point.
  // Pick the smallest bbox (most specific) to handle overlapping bounds.
  let best = null, bestArea = Infinity;
  subdivLayer.eachLayer(l => {
    const b = l.getBounds();
    if (!b.contains(e.latlng)) return;
    const area = (b.getNorth() - b.getSouth()) * (b.getEast() - b.getWest());
    if (area < bestArea) { bestArea = area; best = l; }
  });
  if (!best) return;
  const nid = best.feature.properties.NUTS_ID;
  if (nid !== S.subdivId) enterSubdiv(nid, best.feature.properties, subdivLayer._agg ?? {});
});

// ═══════════════════════════════════════════════════════════════
// LAYER HANDLES
// ═══════════════════════════════════════════════════════════════
let countryLayer   = null;
let subdivLayer    = null;
let subdivRenderer = null;   // SVG renderer for subdivLayer — must be removed separately
let muniLayer      = null;
let muniRenderer   = null;   // Canvas renderer for muniLayer — must be removed separately

// Navigation sequence counter — incremented on every navigation start.
// Async functions check this after each await to abort if navigation changed.
let _navSeq = 0;

function removeMuniLayer() {
  if (muniLayer)    { map.removeLayer(muniLayer);    muniLayer    = null; }
  if (muniRenderer) { map.removeLayer(muniRenderer); muniRenderer = null; }
  S.pinnedMuniLayer = null;
}
function removeSubdivLayer() {
  if (subdivLayer)    { map.removeLayer(subdivLayer);    subdivLayer    = null; }
  if (subdivRenderer) { map.removeLayer(subdivRenderer); subdivRenderer = null; }
}

function setSubdivInteractive(on) {
  // Must target the individual SVG <path> elements, not the pane <div>.
  // pointer-events:none on a parent div still allows SVG children to receive events.
  subdivLayer?.eachLayer(l => {
    if (l._path) l._path.style.pointerEvents = on ? '' : 'none';
  });
}

// ═══════════════════════════════════════════════════════════════
// COLOUR UTILITIES
// ═══════════════════════════════════════════════════════════════
function lerpHex(c1, c2, t) {
  const h = c => [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)];
  const [r1,g1,b1] = h(c1), [r2,g2,b2] = h(c2);
  return '#' + [r1+(r2-r1)*t, g1+(g2-g1)*t, b1+(b2-b1)*t]
    .map(x => Math.round(x).toString(16).padStart(2,'0')).join('');
}

function scaleColor(value, stops, domain) {
  if (value === null || value === undefined) return null;
  let v = Number(value);
  if (domain) {
    const [dMin, dMax] = domain;
    v = dMax > dMin ? Math.max(0, Math.min(100, (v - dMin) / (dMax - dMin) * 100)) : 0;
  }
  v = Math.max(stops[0][0], Math.min(stops[stops.length-1][0], v));
  for (let i = stops.length - 2; i >= 0; i--) {
    if (v >= stops[i][0]) {
      const t = (v - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      return lerpHex(stops[i][1], stops[i+1][1], t);
    }
  }
  return stops[0][1];
}

function fmtChoroplethLabel(tpl, row) {
  const fmtNum = v => (typeof v === 'number') ? v.toLocaleString() : (v ?? '—');
  return tpl.replace(/\{(\w+)\}/g, (_, f) => fmtNum(row[f]));
}

function fmtPop(n) {
  if (!n) return '';
  return Number(n).toLocaleString('de-DE');
}

function fmtAreaM2(m2) {
  const km2 = Number(m2) / 1e6;
  if (!Number.isFinite(km2) || km2 <= 0) return '';
  return `${km2.toLocaleString('en-US', { maximumFractionDigits: km2 >= 100 ? 0 : 2 })} km²`;
}

function degurbaLabel(code) {
  return ({ '1': 'City', '2': 'Town / suburb', '3': 'Rural area' })[String(code)] || String(code);
}

function aggColor(row) {
  const ch = EVAL.choropleth;
  return scaleColor(row?.[ch.valueField], ch.colorScale, ch.domain);
}

function muniColor(row) {
  const cm = EVAL.municipality.colorMap;
  if (!row) return cm['null'];
  return cm[String(row[EVAL.municipality.valueField])] ?? cm['null'];
}

// ═══════════════════════════════════════════════════════════════
// DATA FETCHING
// ═══════════════════════════════════════════════════════════════
async function fetchJSON(url) {
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error(`HTTP ${r.status}: ${url}`);
  return r.json();
}
async function getGeo(key) {
  if (!S.geoCache[key]) S.geoCache[key] = await fetchJSON(BASE + key);
  return S.geoCache[key];
}
// Scores per country/nuts2/nuts3 ({mean, total}) or per municipality of one NUTS3 region ({value, score, website}).
async function getScores(key) {
  if (!(key in S.dataCache)) {
    try { S.dataCache[key] = await fetchJSON(`${SCORING}${key}.json`); }
    catch { S.dataCache[key] = {}; }
  }
  return S.dataCache[key];
}

// ═══════════════════════════════════════════════════════════════
// COUNTRY LAYER
// ═══════════════════════════════════════════════════════════════
async function buildCountryLayer() {
  const geo = await getGeo('countries.geojson');
  const agg = await getScores('country');

  return L.geoJSON(geo, {
    style: feat => countryStyle(feat.properties, agg),
    onEachFeature: (feat, layer) => {
      const props = feat.properties;
      const cc = props.CNTR_CODE;
      layer.bindTooltip(buildCountryTooltip(props, agg[cc]), { sticky:true, direction:'top', opacity:0.97 });
      layer.on({
        mouseover: e => {
          e.target.bringToFront();
          if (S.country !== cc) e.target.setStyle({ weight:3, color:'#1f2937', opacity:1 });
          showInfo_country(props, agg[cc]);
        },
        mouseout: e => {
          if (S.country !== cc) countryLayer?.resetStyle(e.target);
          if (S.level === 'world') unshowInfo();
        },
        click: e => { L.DomEvent.stopPropagation(e); enterCountry(cc, props.has_data, agg); },
      });
    },
  });
}

function countryStyle(props, agg) {
  const cc = props.CNTR_CODE;
  const isDimmed = S.country && S.country !== cc;
  const isActive = S.country === cc;
  const fill = (props.has_data && aggColor(agg?.[cc])) || EVAL.choropleth.noDataColor;
  return {
    fillColor: fill, fillOpacity: isDimmed ? 0.25 : 0.72,
    color: isActive ? '#154194' : '#fff', weight: isActive ? 2 : 0.7, opacity: 1,
  };
}

function buildCountryTooltip(props, row) {
  const cc = props.CNTR_CODE;
  const name = `${countryFlag(cc)} ${countryName(cc)} (${CC_LABEL(cc)})`;
  if (!row) return `<span class="tip-name">${name}</span>`;
  return `<span class="tip-name">${name}</span><br><span class="tip-val">${fmtChoroplethLabel(EVAL.choropleth.label, row)}</span>`;
}

// ═══════════════════════════════════════════════════════════════
// SUBDIVISION LAYER  (NUTS2 or NUTS3 — loaded when a country is selected)
// ═══════════════════════════════════════════════════════════════
async function buildSubdivLayer(cc) {
  const geoKey = S.subdivLevel === 'nuts3' ? 'nuts3.geojson' : 'nuts2.geojson';
  const geo = await getGeo(geoKey);
  const agg = await getScores(S.subdivLevel);

  const filtered = { type:'FeatureCollection',
    features: geo.features.filter(f => f.properties.CNTR_CODE === cc) };
  if (!filtered.features.length) return null;

  // Use a tracked SVG renderer in the high-z pane so it can be fully removed later
  subdivRenderer = L.svg({ pane: 'subdivPane' });
  const result = L.geoJSON(filtered, {
    renderer: subdivRenderer,
    style: feat => subdivStyle(feat.properties, agg),
    onEachFeature: (feat, layer) => {
      const props = feat.properties;
      const nid   = props.NUTS_ID;
      const row   = agg[nid];
      layer.bindTooltip(buildSubdivTooltip(props, row), { sticky:true, direction:'top', opacity:0.97 });
      layer.on({
        mouseover: e => {
          if (S.level === 'subdiv' || S.level === 'lau') return;
          e.target.bringToFront();
          if (S.subdivId !== nid) e.target.setStyle({ weight:2.5, color:'#1f2937', dashArray:null, opacity:1 });
          showInfo_subdiv(props, row);
        },
        mouseout: e => {
          if (S.level === 'subdiv' || S.level === 'lau') return;
          if (S.subdivId !== nid) e.target.setStyle(subdivStyle(feat.properties, agg));
          if (S.level === 'country') unshowInfo();
        },
        click: e => { L.DomEvent.stopPropagation(e); enterSubdiv(nid, props, agg); },
      });
    },
  });
  result._agg = agg;  // expose for map-level click handler
  return result;
}

function subdivStyle(props, agg) {
  const nid = props.NUTS_ID;
  const isActive = S.subdivId === nid;
  const munisVisible = S.level === 'subdiv';
  const isDimmed = munisVisible && S.subdivId !== nid;
  return {
    fillColor:   aggColor(agg?.[nid]) ?? 'transparent',
    // When municipalities are visible, reduce fill so borders are the focus
    fillOpacity: isDimmed ? 0.05 : (munisVisible ? 0.12 : 0.3),
    color:       isActive ? '#1f2937' : '#475569',
    // Thicker, solid borders when municipalities are shown underneath
    weight:      isActive ? 2.5 : (munisVisible ? 1.8 : 1),
    opacity:     isDimmed ? 0.4 : 1,
    dashArray:   isActive ? null : (munisVisible ? null : '5 4'),
  };
}

function subdivDisplayName(props) {
  return props.NAME_LATN || props.NAME || props.NUTS_ID;
}

function buildSubdivTooltip(props, row) {
  const name = subdivDisplayName(props);
  if (!row) return `<span class="tip-name">${name}</span>`;
  return `<span class="tip-name">${name}</span><br><span class="tip-val">${fmtChoroplethLabel(EVAL.choropleth.label, row)}</span>`;
}

// ═══════════════════════════════════════════════════════════════
// MUNICIPALITY LAYERS
// ═══════════════════════════════════════════════════════════════

// Core: build a muni GeoJSON layer from a list of NUTS3 IDs
async function _buildMuniLayerFromNuts3Ids(nuts3Ids) {
  if (!nuts3Ids.length) return null;
  const [geoResults, scoreResults] = await Promise.all([
    Promise.all(nuts3Ids.map(nid => getGeo(`munis_nuts3/${nid}.geojson`).catch(() => null))),
    Promise.all(nuts3Ids.map(nid => getScores(`munis_nuts3/${nid}`))),
  ]);
  const allFeatures = [];
  const scores      = {};
  for (let i = 0; i < nuts3Ids.length; i++) {
    if (geoResults[i]) allFeatures.push(...geoResults[i].features);
    Object.assign(scores, scoreResults[i]);
  }
  if (!allFeatures.length) return null;

  const baseStyle = row => ({ fillColor: muniColor(row), fillOpacity: 0.85, color: '#475569', weight: 0.4, opacity: 0.8 });
  muniRenderer = L.canvas({ padding: 0.5 });
  const layer = L.geoJSON({ type:'FeatureCollection', features:allFeatures }, {
    renderer: muniRenderer,
    style: feat => baseStyle(scores[feat.properties.GISCO_ID]),
    onEachFeature: (feat, layer) => {
      const row = scores[feat.properties.GISCO_ID];
      const pop = feat.properties.POP_2024;
      const muniLabel = feat.properties.LAU_NAME_EN && feat.properties.LAU_NAME_EN !== feat.properties.LAU_NAME
        ? `${feat.properties.LAU_NAME_EN} | ${feat.properties.LAU_NAME}`
        : feat.properties.LAU_NAME;
      const scoreStr = row ? `<br><span class="tip-val">Score ${row.score}</span>` : '';
      const popStr = pop ? ` <span style="color:#94a3b8;font-size:10px">(${fmtPop(pop)})</span>` : '';
      layer.bindTooltip(`<span class="tip-name">${muniLabel}</span>${scoreStr}${popStr}`,
        { sticky:true, direction:'top', opacity:0.97 });
      layer.on({
        mouseover: e => {
          e.target.setStyle({ weight:1.8, color:'#154194', opacity:1 });
          showInfo_muni(feat.properties, row);
        },
        mouseout: e => {
          if (e.target === S.pinnedMuniLayer) return;
          e.target.setStyle(baseStyle(row));
        },
        click: e => {
          L.DomEvent.stopPropagation(e);
          if (S.pinnedMuniLayer && S.pinnedMuniLayer !== e.target) {
            const prevGid = S.pinnedMuniLayer.feature?.properties.GISCO_ID;
            S.pinnedMuniLayer.setStyle(baseStyle(scores[prevGid]));
          }
          S.pinnedMuniLayer = e.target;
          e.target.setStyle({ weight:2.5, color:'#154194', opacity:1, fillOpacity:1.0 });
          pinInfo_muni(feat.properties, row);
        },
      });
    },
  });
  layer._scores = scores;
  return layer;
}

// NUTS2/3 subdivision click → load NUTS3 tiles for that region
async function buildMuniLayerForSubdiv(subdivId) {
  let nuts3Ids;
  if (S.subdivLevel === 'nuts3') {
    nuts3Ids = [subdivId];
  } else {
    const nuts3Geo = await getGeo('nuts3.geojson');
    nuts3Ids = nuts3Geo.features
      .filter(f => f.properties.NUTS_ID.startsWith(subdivId))
      .map(f => f.properties.NUTS_ID);
  }
  return _buildMuniLayerFromNuts3Ids(nuts3Ids);
}

// LAU level → load ALL municipalities for a country at once
async function buildMuniLayerForCountry(cc) {
  const nuts3Geo = await getGeo('nuts3.geojson');
  const nuts3Ids = nuts3Geo.features
    .filter(f => f.properties.CNTR_CODE === cc)
    .map(f => f.properties.NUTS_ID);
  return _buildMuniLayerFromNuts3Ids(nuts3Ids);
}

// ═══════════════════════════════════════════════════════════════
// STATE TRANSITIONS
// ═══════════════════════════════════════════════════════════════

async function enterCountry(cc, hasData, agg) {
  // Same country, same level — no-op
  if (S.country === cc && S.level === 'country') return;
  // Same country at subdiv/lau — go back to country level
  if (S.country === cc && (S.level === 'subdiv' || S.level === 'lau')) { leaveSubdiv(); return; }

  const seq = ++_navSeq;
  showLoading(true, `Loading ${countryName(cc)}…`);

  removeMuniLayer();
  removeSubdivLayer();

  S.country  = cc;
  S.subdivId = null;
  S.infoPinned = false;

  refreshCountryStyles(agg);
  countryLayer?.eachLayer(l => {
    if (l.feature?.properties.CNTR_CODE === cc)
      map.fitBounds(l.getBounds(), { padding:[60,50], maxZoom:9, animate:true, duration:0.6 });
  });

  if (S.subdivLevel === 'lau' && hasData) {
    // LAU mode: skip intermediate layer, go straight to all municipalities
    S.level = 'lau';
    showLoading(true, `Loading all municipalities for ${countryName(cc)}…`);
    muniLayer = await buildMuniLayerForCountry(cc);
    if (_navSeq !== seq) { removeMuniLayer(); return; }
    if (muniLayer) muniLayer.addTo(map);
  } else {
    S.level = 'country';
    if (hasData) {
      subdivLayer = await buildSubdivLayer(cc);
      if (_navSeq !== seq) { removeSubdivLayer(); return; }
      if (subdivLayer) subdivLayer.addTo(map);
    }
  }

  updateNavBar();
  renderLegend();
  showLoading(false);
  const props = countryLayer?.getLayers()
    .find(l => l.feature?.properties.CNTR_CODE === cc)?.feature?.properties
    ?? { CNTR_CODE:cc, has_data:hasData };
  showInfo_country(props, agg[cc]);
}

async function enterSubdiv(sid, subdivProps, subdivAgg) {
  const seq = ++_navSeq;
  showLoading(true, `Loading ${subdivDisplayName(subdivProps)}…`);

  S.level    = 'subdiv';
  S.subdivId = sid;
  S.infoPinned = false;

  subdivLayer?.eachLayer(l => l.setStyle(subdivStyle(l.feature.properties, subdivAgg)));
  subdivLayer?.eachLayer(l => {
    if (l.feature?.properties.NUTS_ID === sid)
      map.fitBounds(l.getBounds(), { padding:[60,50], maxZoom:13, animate:true, duration:0.5 });
  });

  removeMuniLayer();
  muniLayer = await buildMuniLayerForSubdiv(sid);
  if (_navSeq !== seq) { removeMuniLayer(); return; }
  if (muniLayer) { muniLayer.addTo(map); subdivLayer?.bringToFront(); }
  setSubdivInteractive(false);  // pass mouse events to muni canvas; region switch via map click

  updateNavBar();
  renderLegend();
  showLoading(false);
  showInfo_subdiv(subdivProps, subdivAgg?.[sid]);
}

// Leave subdiv OR lau → back to country level (or world for lau)
function leaveSubdiv() {
  if (S.level === 'lau') {
    // LAU has no intermediate country view — go straight to world
    leaveCountry();
    return;
  }

  ++_navSeq;
  setSubdivInteractive(true);
  removeMuniLayer();
  S.level    = 'country';
  S.subdivId = null;
  S.infoPinned = false;

  const agg = S.dataCache[S.subdivLevel] ?? {};
  subdivLayer?.eachLayer(l => l.setStyle(subdivStyle(l.feature.properties, agg)));
  countryLayer?.eachLayer(l => {
    if (l.feature?.properties.CNTR_CODE === S.country)
      map.fitBounds(l.getBounds(), { padding:[60,50], maxZoom:9, animate:true, duration:0.6 });
  });
  updateNavBar();
  renderLegend();
  const props = countryLayer?.getLayers()
    .find(l => l.feature?.properties.CNTR_CODE === S.country)?.feature?.properties;
  if (props) showInfo_country(props, S.dataCache.country?.[S.country]);
}

function leaveCountry() {
  ++_navSeq;
  removeMuniLayer();
  removeSubdivLayer();
  S.level      = 'world';
  S.country    = null;
  S.subdivId   = null;
  S.infoPinned = false;

  refreshCountryStyles(S.dataCache.country ?? {});
  map.flyTo([54,13], 5, { duration:0.7 });
  updateNavBar();
  renderLegend();
  hideInfo();
}

// Switch subdivision level (nuts2 / nuts3 / lau)
async function setSubdivLevel(newLevel) {
  if (S.subdivLevel === newLevel) return;
  S.subdivLevel = newLevel;
  try { localStorage.setItem('muni_subdivLevel', S.subdivLevel); } catch {}
  if (S.level === 'world') { updateNavBar(); return; }

  const seq = ++_navSeq;

  // Collapse to country-outline state first
  removeMuniLayer();
  removeSubdivLayer();
  S.subdivId   = null;
  S.infoPinned = false;

  if (newLevel === 'lau') {
    // Load all municipalities directly
    S.level = 'lau';
    showLoading(true, `Loading all municipalities for ${countryName(S.country)}…`);
    muniLayer = await buildMuniLayerForCountry(S.country);
    if (_navSeq !== seq) { removeMuniLayer(); return; }
    if (muniLayer) muniLayer.addTo(map);
    showLoading(false);
  } else {
    S.level = 'country';
    showLoading(true, `Switching to ${newLevel.toUpperCase()}…`);
    subdivLayer = await buildSubdivLayer(S.country);
    if (_navSeq !== seq) { removeSubdivLayer(); return; }
    if (subdivLayer) subdivLayer.addTo(map);
    showLoading(false);
  }

  updateNavBar();
  renderLegend();
}

// ═══════════════════════════════════════════════════════════════
// NAVIGATION HELPERS
// ═══════════════════════════════════════════════════════════════
function navBack() {
  if      (S.level === 'subdiv' || S.level === 'lau') leaveSubdiv();
  else if (S.level === 'country') leaveCountry();
}

function updateNavBar() {
  const back  = document.getElementById('nav-back');
  const lbl   = document.getElementById('nav-back-label');
  const lvlEl = document.getElementById('level-controls');

  if (S.level === 'world') {
    back.style.display  = 'none';
    lvlEl.style.display = 'none';
  } else {
    back.style.display  = 'block';
    lvlEl.style.display = 'block';
    lbl.textContent = S.level === 'subdiv' ? `Back to ${countryName(S.country)}` : 'Back to Europe';
    document.querySelectorAll('.level-btn')
      .forEach(b => b.classList.toggle('active', b.dataset.level === S.subdivLevel));
  }
}

// MAP CLICK (background → go up one level)
map.on('click', navBack);

function refreshCountryStyles(agg) {
  countryLayer?.eachLayer(l => {
    countryLayer.resetStyle(l);
    l.setStyle(countryStyle(l.feature.properties, agg));
  });
}

// ═══════════════════════════════════════════════════════════════
// INFO PANEL
// ═══════════════════════════════════════════════════════════════
function _setInfo(badge, title, sub, bodyHtml, pinned) {
  document.getElementById('info-badge').textContent = badge;
  document.getElementById('info-title').textContent = title;
  document.getElementById('info-sub').textContent   = sub || '';
  document.getElementById('info-body').innerHTML    = bodyHtml;
  const panel = document.getElementById('info-panel');
  panel.classList.add('visible');
  panel.classList.toggle('pinned', pinned);
}
function _showInfo(badge, title, sub, body) {
  if (S.infoPinned) return;
  _setInfo(badge, title, sub, body, false);
}
function _pinInfo(badge, title, sub, body) {
  S.infoPinned = true;
  _setInfo(badge, title, sub, body, true);
}
function hideInfo() {
  document.getElementById('info-panel').classList.remove('visible', 'pinned');
  S.infoPinned = false;
  if (S.pinnedMuniLayer) {
    const gid = S.pinnedMuniLayer.feature?.properties.GISCO_ID;
    S.pinnedMuniLayer.setStyle({ fillColor: muniColor(muniLayer?._scores?.[gid]),
                                  fillOpacity:0.85, color:'#475569', weight:0.4, opacity:0.8 });
    S.pinnedMuniLayer = null;
  }
}
function unshowInfo() { if (!S.infoPinned) hideInfo(); }

function buildAggInfoHtml(row) {
  const ch = EVAL.choropleth;
  const val = row?.[ch.valueField];
  if (val === null || val === undefined)
    return `<div class="info-row"><span class="lbl">No data</span></div>`;
  const [dMin, dMax] = ch.domain;
  const fillPct = Math.max(0, Math.min(100, (val - dMin) / (dMax - dMin) * 100));
  return `
    <div class="stat-block">
      <div class="stat-header">
        <span>Mean score</span>
        <span class="pct" style="font-size:16px">${val.toLocaleString()}</span>
      </div>
      <div class="stat-bar-track">
        <div class="stat-bar-fill" style="width:${fillPct}%;background:${aggColor(row)}"></div>
      </div>
      <div class="stat-counts">${row.total.toLocaleString()} municipalities scored</div>
    </div>`;
}

function _countryInfoArgs(props, row) {
  const cc = props.CNTR_CODE;
  const name = `${countryFlag(cc)} ${countryName(cc)} (${CC_LABEL(cc)})`;
  const sub  = props.has_data ? 'Click to explore regions' : 'Map display only — no score data';
  return ['Country', name, sub, buildAggInfoHtml(row)];
}

function _subdivInfoArgs(props, row) {
  const badge = S.subdivLevel === 'nuts3' ? 'District' : 'Region';
  const sub   = S.level === 'country' ? 'Click to load municipalities' : props.NUTS_ID;
  const body  = buildAggInfoHtml(row)
    + `<div class="info-row" style="margin-top:6px"><span class="lbl">Code</span><span class="val">${props.NUTS_ID}</span></div>`;
  return [badge, subdivDisplayName(props), sub, body];
}

function _muniInfoArgs(props, row) {
  const title = (props.LAU_NAME_EN && props.LAU_NAME_EN !== props.LAU_NAME)
    ? `${props.LAU_NAME_EN} | ${props.LAU_NAME}`
    : (props.LAU_NAME || '—');
  const sub = props.POP_2024 ? `${fmtPop(props.POP_2024)} pop.` : '';
  const infoRow = (label, valueHtml) => `<div class="info-row"><span class="lbl">${label}</span>${valueHtml}</div>`;
  let body = row
    ? infoRow('Score', `<span class="val">${row.score}</span>`)
      + infoRow('Band', `<span class="val">${EVAL.municipality.colorLabels[row.value] ?? row.value}</span>`)
    : infoRow('No score', '');
  if (row?.website) body += infoRow('Website', `<a href="${row.website}" target="_blank" rel="noopener">${row.website}</a>`);
  if (props.area_m2) body += infoRow('Area', `<span class="val">${fmtAreaM2(props.area_m2)}</span>`);
  if (props.degurba) body += infoRow('DEGURBA', `<span class="val">${props.degurba} · ${degurbaLabel(props.degurba)}</span>`);
  return ['Municipality', title, sub, body];
}

function showInfo_country(p, r)  { _showInfo(..._countryInfoArgs(p, r)); }
function showInfo_subdiv(p, r)   { _showInfo(..._subdivInfoArgs(p, r)); }
function showInfo_muni(p, r)     { _showInfo(..._muniInfoArgs(p, r)); }
function pinInfo_muni(p, r)      { _pinInfo(..._muniInfoArgs(p, r)); }

// ═══════════════════════════════════════════════════════════════
// LEGEND  (level-aware)
// ═══════════════════════════════════════════════════════════════
function renderLegend() {
  const el = document.getElementById('legend');
  el.classList.toggle('closed', _legendUserClosed);
  document.getElementById('legend-toggle').classList.toggle('visible', _legendUserClosed);

  const ch = EVAL.choropleth;
  let html = `<div class="legend-head">
    <div class="legend-title">${EVAL.label}</div>
    <button class="legend-close" onclick="closeLegendPanel()" title="Close legend">×</button>
  </div>`;

  let noDataColor = ch.noDataColor;
  if (S.level === 'subdiv' || S.level === 'lau') {
    // Municipality view — score bands
    const cm = EVAL.municipality.colorMap;
    const cl = EVAL.municipality.colorLabels;
    for (const [k, color] of Object.entries(cm)) {
      if (k === 'null') continue;
      html += `<div class="legend-item"><span class="legend-dot" style="background:${color}"></span>${cl[k] || k}</div>`;
    }
    noDataColor = cm['null'];
  } else {
    // Country / region view — mean score gradient over the colour domain
    const grad = ch.colorScale.map(([v,c]) => `${c} ${v}%`).join(', ');
    html += `<div class="legend-gradient" style="background:linear-gradient(to right,${grad})"></div>`;
    html += `<div class="legend-range"><span>≤ ${ch.domain[0]}</span><span>Mean score</span><span>≥ ${ch.domain[1]}</span></div>`;
  }

  html += `<div class="legend-nodata"><span class="legend-dot" style="background:${noDataColor}"></span>No data</div>`;
  el.innerHTML = html;
}

// ═══════════════════════════════════════════════════════════════
// LOADING + PANEL TOGGLES
// ═══════════════════════════════════════════════════════════════
function showLoading(on, msg) {
  document.getElementById('loading').classList.toggle('show', on);
  if (msg) document.getElementById('loading-msg').textContent = msg;
}

function toggleControls() {
  const collapsed = document.body.classList.toggle('controls-collapsed');
  document.getElementById('subnav-toggle').textContent = collapsed ? '›' : '‹';
  setTimeout(() => map.invalidateSize(), 220);
}

let _legendUserClosed = false;

function closeLegendPanel() {
  _legendUserClosed = true;
  document.getElementById('legend').classList.add('closed');
  document.getElementById('legend-toggle').classList.add('visible');
}

function showLegendPanel() {
  _legendUserClosed = false;
  document.getElementById('legend').classList.remove('closed');
  document.getElementById('legend-toggle').classList.remove('visible');
}

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
(async function init() {
  showLoading(true, 'Initialising…');
  try {
    const level = localStorage.getItem('muni_subdivLevel');
    if (level) S.subdivLevel = level;
  } catch {}
  try {
    EVAL = await fetchJSON(`${SCORING}index.json`);
    countryLayer = await buildCountryLayer();
    countryLayer.addTo(map);
    renderLegend();
  } catch (err) {
    console.error('Init error:', err);
    document.getElementById('loading-msg').textContent = `Error: ${err.message}`;
    return;
  }
  showLoading(false);
})();
</script>
</body>
